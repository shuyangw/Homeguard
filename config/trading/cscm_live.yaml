# CSCM (Cross-Sectional Crypto Momentum) Live Trading Configuration
#
# Strategy: Weekly rebalancing of crypto positions based on momentum ranking
# Broker: Coinbase (primary) with Alpaca Crypto failover
# Schedule: Weekly rebalance on Sunday 0:00 UTC (24/7 crypto trading)
#
# Backtest Results (2021-2024):
#   Sharpe Ratio: 1.41
#   Total Return: 1566%
#   Max Drawdown: 19%
#   Win Rate: ~52%

# Symbol Universe
# Major crypto assets tradeable on Coinbase and Alpaca
# Note: MKR/USD removed 2026-04-24 -- not available on Alpaca (CSCM's
# failover broker) and failing hourly from Binance. See
# docs/progress/20260424_MKR_DROP_AND_GATEWAY_REDEPLOY.md.
universe:
  - BTC/USD
  - ETH/USD
  - SOL/USD
  - AVAX/USD
  - LINK/USD
  - DOGE/USD
  - DOT/USD
  - LTC/USD
  - BCH/USD
  - UNI/USD
  - AAVE/USD
  - SUSHI/USD

# Strategy Parameters (optimized from backtest)
top_n: 7                    # Number of top momentum coins to hold
momentum_period: 28         # Days for momentum calculation
btc_sma_period: 40          # BTC SMA period for regime detection (optimized from 50)

# Rebalancing
rebalance_day: sunday       # Day of week to rebalance
check_interval_hours: 1     # Hours between rebalance checks

# Risk Management
go_to_cash_in_bear: true    # Exit all positions when BTC < SMA (bearish regime)
trailing_stop_pct: 0.25     # 25% trailing stop - exit if portfolio drops 25% from peak

# Weighting
weighting: equal            # 'equal' = 1/N, 'momentum' = momentum-weighted

# Per-fill BUY headroom factor. Each BUY's target notional is multiplied by
# this before computing target_qty so the actual fill (with broker-applied
# adverse slippage + fees) still fits within available cash. The rebalance
# loop also re-reads cash before each BUY so cumulative drift is absorbed
# by smaller subsequent targets, never starving the final symbol.
#   0.998 = 20 bps buffer (default; covers DemoBroker's ~12.5 bps drag)
#   0.995 = 50 bps buffer (use for higher-volatility brokers)
buy_safety_factor: 0.998

# Broker Settings
broker:
  primary: coinbase         # Primary broker
  secondary: alpaca         # Failover broker
  auto_failover: true       # Enable automatic failover

# Logging
log_level: INFO
trade_log_enabled: true
