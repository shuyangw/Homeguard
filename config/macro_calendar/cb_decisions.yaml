# Curated central-bank policy decision calendar (keyless, version-controlled).
# Covers the in-universe CBs for the FX vertical: ECB/BOE/BOJ/SNB/RBA/RBNZ/NORGES/RIKSBANK/BANXICO/FOMC.
#
# RBA and RBNZ were BACKFILLED 2026-07-25 for 2011-2026 (previously one date each,
# both 2025, which made the AUD/NZD +-7d entry blackout a no-op in 12 of 13
# walk-forward windows -- defect 3 of the #35 Kalman diagnostic).
# These backfilled dates are RULE-GENERATED, not scraped actuals:
#   RBA  = first Tuesday of each month (Feb-Dec pre-2024; the 8 published
#          meeting months from 2024, when the RBA moved to 8 meetings/year).
#   RBNZ = fourth Wednesday of Feb, Apr, May, Jul, Aug, Oct, Nov (7 reviews/yr).
# Individual dates may be off by a few days. That is acceptable for a +-7d
# blackout (the window still covers the true decision) but these must NOT be
# used for event-time studies needing exact timestamps.
# Other banks remain the 2025-2026 starter set; their backfill is still deferred.
