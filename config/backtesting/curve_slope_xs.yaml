# config/backtesting/curve_slope_xs.yaml
# #10 Curve-slope cross-sectional RV. Carry == annualized front-pair roll yield
# == curve slope, so FuturesCarryXS on a commodity-only universe ranks slope
# cross-sectionally across the commodity block (long backwardated / short contango).
asset_class: futures

strategy:
  name: FuturesCarryXS
  universe: [CL, BZ, NG, HO, RB, GC, SI, HG, PL, ZC, ZW, ZS, ZL, ZM, LE, HE]

dates:
  start: "2010-06-07"
  end: "2026-02-20"

backtest:
  initial_capital: 10000000
  vol_target_per_instrument: 0.20
  rebalance: weekly
  cost_mult: 1.0
  idm: true

pre_registration:
  construction: "FuturesCarryXS (front-pair roll-yield = curve slope) demeaned within the single commodity group, over the commodity block only."
  expected_sign: "long_short"
  hypothesis: "Cross-sectional curve slope (backwardation vs contango) predicts relative commodity returns; elevated prior risk of the same failure mode as XS carry."
