# Hurst Mean Reversion Strategy - Relaxed Config
# More lenient parameters for more trading signals

mode: single

strategy:
  name: HurstMRStrategy
  parameters:
    # Hurst parameters - MORE RELAXED
    hurst_window: 50            # Shorter window (more responsive)
    hurst_threshold: 0.55       # Higher threshold (allow more regimes)

    # Z-score parameters - MORE RELAXED
    zscore_window: 20
    zscore_entry_threshold: 1.5 # Lower threshold (more entries)
    zscore_exit_threshold: 0.3  # Tighter exit

    # Risk management (ATR-based)
    atr_period: 14
    atr_stop_multiplier: 1.5
    atr_target_multiplier: 4.5

    # Trade management
    long_only: false
    max_hold_bars: 10

symbols:
  list:
    - BTC_USD
    - ETH_USD

dates:
  start: '2021-01-01'
  end: '2024-12-31'

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: BTC_USD
  market_hours_only: false
  allow_shorts: true
  portfolio_mode: single
  timeframe: crypto_1day

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 1
  stop_loss_pct: 0.10

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
