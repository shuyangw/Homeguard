# ORB High Volatility Strategy - Baseline
# Usage: python -m src.backtest_runner --config config/backtesting/orb_hv_baseline.yaml
#
# This strategy focuses on "Stocks in Play" - stocks with abnormally high
# opening volume driven by news catalysts. Based on Zarattini, Barbon & Aziz (2024).

mode: single

strategy:
  name: ORBHighVolatilityStrategy
  parameters:
    # Opening Range (5 minutes is standard for high-volatility)
    opening_range_minutes: 5

    # Stocks in Play (SIP) Score
    sip_lookback_days: 14
    sip_min_score: 2.0  # Minimum 2x normal opening volume

    # Gap Filtering (2-15% gaps only)
    min_gap_pct: 0.02
    max_gap_pct: 0.15
    gap_direction_filter: true  # Trade in direction of gap

    # Volatility (ATR-based bounds)
    atr_period: 14
    min_atr_pct: 2.0   # 2% minimum daily volatility
    max_atr_pct: 10.0  # 10% maximum (avoid extreme moves)

    # Tiered Exits
    target1_multiplier: 1.0   # First target at 1x OR height (1R)
    target1_exit_pct: 0.5     # Exit 50% at target 1
    target2_multiplier: 2.0   # Second target at 2x OR height (2R)
    use_trailing_stop: true
    trailing_offset_pct: 0.02  # 2% trailing offset
    eod_exit_hour: 15
    eod_exit_minute: 55       # Exit at 3:55 PM (no overnight)

    # Daily Risk Limits
    daily_max_loss_pct: 0.03  # 3% max daily loss
    max_daily_trades: 10
    max_concurrent_positions: 5

    # Entry Filters
    entry_cutoff_hour: 15
    entry_cutoff_minute: 30   # No new trades after 3:30 PM
    rvol_threshold: 1.5       # Volume confirmation

    # Sentiment (disabled for baseline - Phase 2)
    use_sentiment: false
    min_sentiment_score: 0.2

    # Regime Filter
    use_regime: true

    # Direction
    long_only: false

symbols:
  # 3x Leveraged ETFs (high volatility, liquid)
  list: [TQQQ, SQQQ, SOXL, SOXS, UPRO, SPXU, TNA, TZA]

dates:
  start: "2022-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.001  # Higher slippage for volatile instruments
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
