# ICT Strategy - Full Year 2024 Test
mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: both
    swing_lookback: 5
    min_swing_size_pct: 0.002
    min_impulse_move_pct: 0.003
    order_block_max_age: 60
    impulse_bars: 12
    risk_reward_ratio: 1.2
    use_htf_filter: true
    htf_lookback: 30
    use_regime: true
    long_only: false
    max_positions_per_day: 3
    atr_period: 14
    atr_stop_multiplier: 1.5
    exit_time_hour: 15
    exit_time_minute: 45
    min_wick_ratio: 0.5
    min_body_ratio: 0.35
    sweep_threshold_pct: 0.001
    use_volume_filter: true
    rvol_threshold: 1.3
    session_filter: none

symbols:
  list: [NVDA, TSLA, AMD, META, GOOGL, AMZN, NFLX, AAPL, MSFT, SPY]

dates:
  start: "2024-01-01"
  end: "2024-12-10"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.08
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
