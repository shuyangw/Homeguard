# ICT Strategy Parameter Sweep - Find Optimal Balance Between Quality and Quantity

mode: sweep

strategy:
  name: ICTStrategy
  parameters:
    swing_lookback: 5
    min_impulse_move_pct: 0.003
    order_block_max_age: 60
    impulse_bars: 12
    use_regime: true
    long_only: false
    atr_period: 14
    atr_stop_multiplier: 1.5
    exit_time_hour: 15
    exit_time_minute: 45
    sweep_threshold_pct: 0.001
    session_filter: none
    use_zone_quality: false
    rvol_threshold: 1.3

symbols:
  list: [NVDA, TSLA, AMD, META, GOOGL, AMZN, NFLX, AAPL, MSFT, SPY]

dates:
  start: "2024-01-01"
  end: "2024-06-30"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.08
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 0

sweep:
  objective: sharpe
  parameters:
    trade_type:
      type: categorical
      values: [continuation, both]
    max_positions_per_day:
      type: categorical
      values: [2, 3, 4]
    risk_reward_ratio:
      type: categorical
      values: [1.2, 1.5, 2.0]
    use_htf_filter:
      type: categorical
      values: [true, false]
    use_volume_filter:
      type: categorical
      values: [true, false]
    min_wick_ratio:
      type: categorical
      values: [0.4, 0.5]
    min_body_ratio:
      type: categorical
      values: [0.3, 0.35]
    min_swing_size_pct:
      type: categorical
      values: [0.0015, 0.002]
    htf_lookback:
      type: categorical
      values: [20, 30]
