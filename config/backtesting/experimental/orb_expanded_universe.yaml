# Opening Range Breakout - Expanded Leveraged ETF Universe
# Usage: python -m src.backtest_runner --config config/backtesting/orb_expanded_universe.yaml

mode: sweep

strategy:
  name: ORBStrategy
  parameters:
    opening_range_minutes: 15
    rvol_threshold: 1.5
    rvol_lookback: 20
    fast_ema: 9
    slow_ema: 21
    target_multiplier: 1.0
    long_only: false
    use_regime: true
    use_gap_filter: false

symbols:
  # All 19 leveraged ETFs from OMR expanded universe
  file: backtest_lists/omr_expanded_universe_no_header.csv

dates:
  start: "2022-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

sweep:
  sort_by: "Sharpe Ratio"
  top_n: 10
  parallel: true
  max_workers: 4
  export_csv: true
  export_html: true

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
