# ICT/SMC Liquidity Strategy - Reversal Variant
# Usage: python -m src.backtest_runner --config config/backtesting/ict_reversal.yaml
#
# Reversal trades: Counter-trend entries at external liquidity sweeps
# Higher risk/reward, lower win rate, targets full reversals

mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: reversal
    swing_lookback: 5
    min_swing_size_pct: 0.002      # 0.2% minimum swing
    min_impulse_move_pct: 0.003    # 0.3% impulse for 1-min data
    order_block_max_age: 100       # OB valid for 100 bars
    impulse_bars: 15               # 15-bar window for impulse detection
    risk_reward_ratio: 2.5         # Higher RR for reversals
    use_htf_filter: true
    htf_lookback: 20
    use_regime: true
    long_only: false
    max_positions_per_day: 2       # Conservative for reversals
    atr_period: 14
    atr_stop_multiplier: 1.5
    exit_time_hour: 15
    exit_time_minute: 45
    min_wick_ratio: 0.5            # Strong rejection required
    min_body_ratio: 0.3
    sweep_threshold_pct: 0.001

    # Optional features from original spec (disabled by default - enable to test)
    # use_atr_impulse: false       # Use ATR multiple instead of percentage for impulse
    # atr_impulse_multiple: 1.5    # ATR multiple (1.5x, 2x, 3x per spec)
    # use_volume_filter: false     # Require above-average volume on entry
    # rvol_threshold: 1.5          # RVOL threshold (1.0, 1.5, 2.0 per spec)
    # session_filter: none         # Options: none, us_regular, us_core, ny_open, power_hour
    # use_zone_quality: false      # Filter zones by quality score
    # min_zone_quality: 0.5        # Minimum zone quality (0.0-1.0)

symbols:
  # High liquidity stocks and ETFs for clean structure
  list: [SPY, QQQ, AAPL, MSFT, NVDA, TSLA, TQQQ, SOXL]

dates:
  start: "2023-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001                      # 0.1% commission
  slippage: 0.0005                 # 0.05% slippage for 1-min entries
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.05          # 5% per trade (conservative for reversals)
  max_positions: 3

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
