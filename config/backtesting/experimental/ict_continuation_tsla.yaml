# ICT/SMC Liquidity Strategy - Continuation on Volatile Symbols
# Usage: python -m src.backtest_runner --config config/backtesting/ict_continuation_tsla.yaml

mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: continuation
    swing_lookback: 5
    min_swing_size_pct: 0.002       # 0.2% - lower for volatile stocks
    min_impulse_move_pct: 0.003     # 0.3% impulse
    order_block_max_age: 80
    impulse_bars: 15
    risk_reward_ratio: 1.5
    use_htf_filter: true
    htf_lookback: 20
    use_regime: true
    long_only: false
    max_positions_per_day: 5
    atr_period: 14
    atr_stop_multiplier: 1.0
    exit_time_hour: 15
    exit_time_minute: 45
    min_wick_ratio: 0.35
    min_body_ratio: 0.2
    sweep_threshold_pct: 0.001

symbols:
  list: [TSLA]

dates:
  start: "2023-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.08
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
