# ICT/SMC Liquidity Strategy - Continuation Variant
# Usage: python -m src.backtest_runner --config config/backtesting/ict_continuation.yaml
#
# Continuation trades: Trend-following entries at pullbacks to order blocks
# Lower risk/reward, higher win rate, riding existing trends

mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: continuation
    swing_lookback: 5
    min_swing_size_pct: 0.003      # Slightly larger swings for clear structure
    min_impulse_move_pct: 0.004    # 0.4% impulse for 1-min data
    order_block_max_age: 60        # Fresher OBs for continuation
    impulse_bars: 15               # 15-bar window for impulse detection
    risk_reward_ratio: 1.5         # Lower RR, higher WR
    use_htf_filter: true
    htf_lookback: 20
    use_regime: true
    long_only: false
    max_positions_per_day: 5       # More trades for continuation
    atr_period: 14
    atr_stop_multiplier: 1.0       # Tighter stops
    exit_time_hour: 15
    exit_time_minute: 45
    min_wick_ratio: 0.4            # Moderate rejection
    min_body_ratio: 0.25
    sweep_threshold_pct: 0.001

    # Optional features from original spec (disabled by default - enable to test)
    # use_atr_impulse: false       # Use ATR multiple instead of percentage for impulse
    # atr_impulse_multiple: 1.5    # ATR multiple (1.5x, 2x, 3x per spec)
    # use_volume_filter: false     # Require above-average volume on entry
    # rvol_threshold: 1.5          # RVOL threshold (1.0, 1.5, 2.0 per spec)
    # session_filter: none         # Options: none, us_regular, us_core, ny_open, power_hour
    # use_zone_quality: false      # Filter zones by quality score
    # min_zone_quality: 0.5        # Minimum zone quality (0.0-1.0)

symbols:
  # High liquidity stocks and ETFs
  list: [SPY, QQQ, AAPL, MSFT, NVDA, TSLA, AMD, META, GOOGL, AMZN]

dates:
  start: "2023-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.08          # 8% per trade (trend-following)
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
