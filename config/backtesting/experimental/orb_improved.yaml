# Opening Range Breakout - Improved Config (Phases 1-3)
# Usage: python -m src.backtest_runner --config config/backtesting/orb_improved.yaml

mode: single

strategy:
  name: ORBStrategy
  parameters:
    # Opening Range
    opening_range_minutes: 15
    min_or_width_pct: 0.25  # Phase 1: Skip narrow ORs (0.25% moderate)

    # Entry Filters
    rvol_threshold: 1.5
    rvol_lookback: 20
    fast_ema: 9
    slow_ema: 21
    use_regime: false  # Disable for cleaner testing
    use_gap_filter: false

    # Phase 2: Entry Quality
    breakout_buffer_pct: 0.05  # 5% of OR height as buffer (moderate)
    entry_cutoff_hour: 15  # No entries after 3 PM
    entry_cutoff_minute: 0

    # Phase 3: Risk Management
    use_atr_stops: true
    atr_period: 14
    atr_stop_multiplier: 1.5
    use_volume_confirmation: false  # Disabled for now
    volume_breakout_mult: 1.5
    use_trailing_stop: true

    # Target and Trade Management
    target_multiplier: 1.5  # Increased from 1.0
    one_trade_per_day: true  # Phase 1: One shot per day
    long_only: false

symbols:
  # 3x Leveraged ETFs
  list: [TQQQ, SOXL, UPRO, TNA, TECL]

dates:
  start: "2024-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 2
