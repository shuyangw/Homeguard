# ICT/SMC Liquidity Strategy - Relaxed Parameters for Testing
# Usage: python -m src.backtest_runner --config config/backtesting/ict_relaxed.yaml
#
# Relaxed thresholds to generate more signals for validation

mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: both                # Both reversal and continuation
    swing_lookback: 3               # Smaller lookback for more swings
    min_swing_size_pct: 0.001       # Lower threshold (0.1%)
    min_impulse_move_pct: 0.002     # Lower impulse threshold (0.2%)
    order_block_max_age: 100        # Longer OB validity
    impulse_bars: 20                # Larger window for impulse detection
    risk_reward_ratio: 1.5          # Moderate RR
    use_htf_filter: false           # Disable HTF filter for more signals
    htf_lookback: 20
    use_regime: false               # Disable regime filter for more signals
    long_only: false
    max_positions_per_day: 10       # More trades allowed
    atr_period: 14
    atr_stop_multiplier: 1.0
    exit_time_hour: 15
    exit_time_minute: 45
    min_wick_ratio: 0.3             # Lower rejection requirement
    min_body_ratio: 0.2             # Lower body requirement
    sweep_threshold_pct: 0.0005     # Lower sweep threshold

symbols:
  # Focus on volatile symbols
  list: [TSLA, NVDA, AMD, TQQQ, SOXL]

dates:
  start: "2024-01-01"
  end: "2024-06-30"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
