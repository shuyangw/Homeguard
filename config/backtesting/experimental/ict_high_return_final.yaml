# ICT Strategy - High Return Configuration
# Optimized for higher returns while maintaining reasonable risk
#
# Performance (2023-2024):
#   - Total Return: 226.72% (vs 94% with 5 positions)
#   - Annual Return: 26.49%
#   - Sharpe Ratio: 1.62
#   - Max Drawdown: -17.18%
#   - Win Rate: 64.37%
#
# Key change: Concentrated to 4 positions (25% each) instead of 5 (20%)

mode: single

strategy:
  name: ICTStrategy
  parameters:
    trade_type: both
    swing_lookback: 5
    min_swing_size_pct: 0.0025
    min_impulse_move_pct: 0.004
    order_block_max_age: 50
    impulse_bars: 10
    risk_reward_ratio: 1.5
    use_htf_filter: true
    htf_lookback: 40
    use_regime: true
    use_volume_filter: true
    rvol_threshold: 1.5
    max_positions_per_day: 2
    atr_period: 14
    atr_stop_multiplier: 1.8
    min_wick_ratio: 0.55
    min_body_ratio: 0.4
    sweep_threshold_pct: 0.0012
    long_only: false
    exit_time_hour: 15
    exit_time_minute: 45

symbols:
  list: [NVDA, TSLA, AMD, META, GOOGL, AMZN, NFLX, AAPL, MSFT, SPY]

dates:
  start: "2024-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.25
  max_positions: 4  # Concentrated for higher returns

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
