# ML Crypto Mean Reversion Strategy - Walk-Forward Validation
#
# Walk-forward testing to validate strategy robustness:
# - Train on 12 months of data
# - Test on next 3 months (out-of-sample)
# - Step forward 3 months and repeat
# - Combine all OOS results for true performance estimate
#
# Expected OOS degradation: 10-15% from in-sample (acceptable)
#
# Usage: python -m src.backtest_runner --config config/backtesting/ml_crypto_mr_walk_forward.yaml

mode: walk_forward

strategy:
  name: MLCryptoMRStrategy
  parameters:
    # Fixed parameters (not optimized)
    zscore_window: 20
    rsi_period: 14
    atr_period: 14
    use_ml_filter: true
    ml_lookback_days: 252
    ml_retrain_frequency: 20
    long_only: false
    max_hold_bars: 10

symbols:
  list:
    - BTC_USD
    - ETH_USD

dates:
  start: '2020-01-01'
  end: '2024-12-31'

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.001
  benchmark: BTC_USD
  market_hours_only: false
  allow_shorts: true
  portfolio_mode: multi
  timeframe: crypto_1day

optimization:
  metric: sharpe_ratio
  param_grid:
    # Key parameters to optimize
    zscore_entry_threshold: [1.5, 2.0, 2.5, 3.0]
    atr_stop_multiplier: [1.0, 1.5, 2.0]
    atr_target_multiplier: [3.0, 4.0, 5.0]
    adx_threshold: [20.0, 25.0, 30.0]
    rsi_oversold: [25.0, 30.0, 35.0]
    rsi_overbought: [65.0, 70.0, 75.0]
  n_jobs: 4

walk_forward:
  train_months: 12               # 12 months training window
  test_months: 3                 # 3 months test window
  step_months: 3                 # Step forward 3 months
  export_results: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.20
  max_positions: 2

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
