# ICT Strategy - Best ICT-Aligned Configuration
# 
# RESULT: +49.06% return, 0.65 Sharpe, -21.12% max DD
#
# KEY SETTINGS (ICT-aligned):
# - session_filter: ny_open (ICT Kill Zone concept)
# - risk_reward_ratio: 1.5 (tighter than default 2.0)
# - No momentum/EMA filters (pure ICT)
#
# WHY THIS WORKS:
# - NY Open (9:30-11:30 AM ET) is ICT's primary kill zone
# - Institutions are most active during this window
# - Liquidity sweeps are more reliable in this session
# - Tighter 1.5 R:R captures more winners before reversals

mode: single
strategy:
  name: ICTStrategy
  parameters:
    trade_type: both
    swing_lookback: 5
    min_swing_size_pct: 0.003
    min_impulse_move_pct: 0.005
    order_block_max_age: 30
    impulse_bars: 8
    risk_reward_ratio: 1.5
    use_htf_filter: false
    use_regime: false
    use_volume_filter: false
    session_filter: ny_open
    max_positions_per_day: 3
    atr_period: 14
    atr_stop_multiplier: 1.5
    min_wick_ratio: 0.5
    min_body_ratio: 0.3
    sweep_threshold_pct: 0.0015
    long_only: false
    exit_time_hour: 15
    exit_time_minute: 45
    min_sweep_depth_pct: 0.0
    use_momentum_filter: false
    use_trailing_stop: false
    use_structure_filter: false
    require_ob_confluence: false
symbols:
  list:
  - TQQQ
  - SQQQ
  - UPRO
  - TNA
  - TZA
dates:
  start: '2024-01-01'
  end: '2024-12-31'
backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi
risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.1
  max_positions: 4
output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
