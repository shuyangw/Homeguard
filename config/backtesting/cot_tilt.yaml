asset_class: futures
strategy:
  name: FuturesCoTTilt
  universe: [ES, NQ, YM, ZN, ZB, ZF, ZT, CL, NG, HO, RB, GC, SI, HG, PL, ZC, ZW, ZS, ZL, ZM, LE, HE]
dates:
