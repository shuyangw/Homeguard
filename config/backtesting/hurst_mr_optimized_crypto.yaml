# Hurst Mean Reversion Strategy - Optimized Crypto Config
# Top 5 symbols from training optimization with stricter Hurst filter
#
# Strategy: Focus on mean-reverting crypto with fixed R:R targets
# Hurst Threshold: 0.40 (stricter - only most mean-reverting conditions)
# Position Sizing: 20% per symbol, 100% total across 5 symbols
# Risk Profile: Fixed % exits with 1:3.18 R:R ratio

mode: single

strategy:
  name: HurstMRStrategy
  parameters:
    # Hurst parameters - STRICTER FILTER
    hurst_window: 100           # Rolling window for Hurst calculation
    hurst_threshold: 0.40       # H < 0.40 only (strict mean-reverting)

    # Z-score parameters
    zscore_window: 20           # Z-score lookback
    zscore_entry_threshold: 2.0 # Entry when |Z| > 2.0 (extreme deviation)
    zscore_exit_threshold: 0.3  # Exit when |Z| < 0.3 (mean reversion)

    # Risk management (Fixed % exits)
    atr_period: 14
    atr_stop_multiplier: 1.5    # Not used - using fixed %
    atr_target_multiplier: 4.5  # Not used - using fixed %

    # FIXED PERCENTAGE EXITS (optimization result)
    use_fixed_pct_exits: true
    fixed_stop_pct: 0.10        # 10% stop loss
    fixed_target_pct: 0.318     # 31.8% target (3.18:1 R:R)

    # Trade management
    long_only: false            # Allow both long and short
    max_hold_bars: 5            # Shorter holding period for crypto volatility

symbols:
  list:
    - YFI_USD      # Yearn Finance (top 1)
    - BCH_USD      # Bitcoin Cash (top 2)
    - LINK_USD     # Chainlink (top 3)
    - MKR_USD      # Maker (top 4)
    - ETH_USD      # Ethereum (top 5)

dates:
  start: '2021-01-01'
  end: '2024-12-31'

backtest:
  initial_capital: 100000
  fees: 0.001                   # 0.1% fees (typical crypto exchange)
  slippage: 0.0005              # 0.05% slippage
  benchmark: BTC_USD
  market_hours_only: false      # 24/7 crypto markets
  allow_shorts: true
  portfolio_mode: single
  timeframe: crypto_1hour       # Hourly data for swing trades

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.20       # 20% per symbol
  max_positions: 5              # All 5 symbols
  stop_loss_pct: 0.10           # 10% hard stop

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
