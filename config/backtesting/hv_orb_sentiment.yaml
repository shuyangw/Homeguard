# HV ORB (High Volatility Opening Range Breakout) Strategy with Sentiment
# Usage: python -m src.backtest_runner --config config/backtesting/hv_orb_sentiment.yaml
#
# Prerequisites:
#   1. Download news: python scripts/download_news.py --symbols AAPL,MSFT,NVDA,TSLA,AMD,META,GOOGL,AMZN
#   2. Compute sentiment: python scripts/compute_all_sentiment.py

mode: single

strategy:
  name: HVORBStrategy
  parameters:
    # Opening Range (5 minutes)
    opening_range_minutes: 5

    # Stocks in Play (SIP) Score - 1.5x average volume threshold
    sip_lookback_days: 14
    sip_min_score: 1.5

    # Gap Filtering (2-15% gaps only)
    min_gap_pct: 0.02
    max_gap_pct: 0.15
    gap_direction_filter: true

    # Volatility (ATR-based bounds) - adjusted for individual stocks
    atr_period: 14
    min_atr_pct: 0.03
    max_atr_pct: 3.0

    # Tiered Exits
    target1_multiplier: 1.0
    target1_exit_pct: 0.5
    target2_multiplier: 2.0
    use_trailing_stop: true
    trailing_offset_pct: 0.02
    eod_exit_hour: 15
    eod_exit_minute: 55

    # Daily Risk Limits
    daily_max_loss_pct: 0.03
    max_daily_trades: 10
    max_concurrent_positions: 5

    # Entry Filters - ORB works best in first 2 hours
    entry_cutoff_hour: 11
    entry_cutoff_minute: 0
    rvol_threshold: 1.5

    # SENTIMENT ENABLED (FinBERT)
    use_sentiment: true
    min_sentiment_score: 0.3
    min_sentiment_confidence: 0.7  # Only use high-confidence sentiment
    skip_earnings_days: true       # Avoid trading on earnings announcement days

    # Regime Filter
    use_regime: true

    # Direction (long_only=true required due to backtest engine signal handling)
    long_only: true

symbols:
  list: [AAPL, MSFT, NVDA, TSLA, AMD, META, GOOGL, AMZN]

dates:
  start: "2024-01-01"
  end: "2024-06-30"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.001
  benchmark: SPY
  market_hours_only: true
  allow_shorts: false
  portfolio_mode: multi

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
