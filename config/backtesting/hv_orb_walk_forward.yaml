# HV ORB (High Volatility Opening Range Breakout) Strategy - Walk-Forward Validation
# Usage: python -m src.backtest_runner --config config/backtesting/hv_orb_walk_forward.yaml
#
# This config runs walk-forward validation to test out-of-sample performance.
# Parameters are optimized on training windows and tested on held-out test windows.

mode: walk_forward

strategy:
  name: HVORBStrategy
  parameters:
    # Fixed parameters (not optimized)
    opening_range_minutes: 5
    sip_lookback_days: 14
    atr_period: 14
    eod_exit_hour: 15
    eod_exit_minute: 55
    entry_cutoff_hour: 15
    entry_cutoff_minute: 30
    daily_max_loss_pct: 0.03
    max_daily_trades: 10
    max_concurrent_positions: 5
    use_trailing_stop: true
    trailing_offset_pct: 0.02
    gap_direction_filter: true
    use_regime: true
    long_only: false

    # Sentiment disabled for walk-forward (requires pre-computed data)
    use_sentiment: false
    min_sentiment_score: 0.2

symbols:
  list: [TQQQ, SQQQ, SOXL, SOXS, UPRO, SPXU]

dates:
  start: "2020-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.001
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

optimization:
  metric: sharpe_ratio
  param_grid:
    # SIP threshold
    sip_min_score: [1.5, 2.0, 2.5, 3.0]
    # Gap range
    min_gap_pct: [0.01, 0.02, 0.03]
    max_gap_pct: [0.10, 0.15, 0.20]
    # Volatility bounds
    min_atr_pct: [1.5, 2.0, 2.5]
    max_atr_pct: [8.0, 10.0, 12.0]
    # Exit targets
    target1_multiplier: [0.75, 1.0, 1.25]
    target2_multiplier: [1.5, 2.0, 2.5]
    # Volume filter
    rvol_threshold: [1.0, 1.5, 2.0]
  n_jobs: 4

walk_forward:
  train_months: 12
  test_months: 3
  step_months: 3
  export_results: true

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
