# Overnight Mean Reversion Strategy - Single Backtest
# Usage: python -m src.backtest_runner --config config/backtesting/omr_backtest.yaml

mode: single

strategy:
  name: OvernightMeanReversion
  parameters:
    min_probability: 0.55
    min_expected_return: 0.002
    max_positions: 5

symbols:
  list: [QQQ, TQQQ, SOXL, TECL, SPY]

dates:
  preset: full_periods.five_years  # 2020-01-01 to 2024-12-31

backtest:
  initial_capital: 100000
  fees: 0.001          # deprecated fallback; honored only when costs.tier is unset
  slippage: 0.0005     # deprecated fallback; honored only when costs.tier is unset
  benchmark: SPY
  market_hours_only: true
  allow_shorts: false

# Per methodology Section 4. leveraged_etf tier -> ~22.5 bps round-trip.
costs:
  tier: leveraged_etf
  stop_slippage_multiplier: 1.5

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.15
  max_positions: 5
  stop_loss_pct: 0.03

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
