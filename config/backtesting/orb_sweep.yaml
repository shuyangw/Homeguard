# Opening Range Breakout - Parameter Sweep/Optimization
# Usage: python -m src.backtest_runner --config config/backtesting/orb_sweep.yaml

mode: optimize

strategy:
  name: ORBStrategy
  # Base parameters (will be overridden by param_grid)
  parameters:
    long_only: false
    use_regime: true
    use_gap_filter: false

symbols:
  list: [TQQQ, SOXL, UPRO, TNA, TECL]

dates:
  start: "2020-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

optimization:
  metric: sharpe_ratio
  param_grid:
    opening_range_minutes: [5, 10, 15, 30]
    rvol_threshold: [1.0, 1.5, 2.0]
    target_multiplier: [0.5, 1.0, 1.5, 2.0]
  n_jobs: 4

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_reports: true
  verbosity: 1
