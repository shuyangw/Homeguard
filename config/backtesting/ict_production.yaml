# ICT/SMC Liquidity Strategy - Production Configuration
# Validated parameters with consistent performance across 2024
#
# Performance (Full Year 2024):
#   - Sharpe Ratio: 1.63
#   - Total Return: 29.26%
#   - Win Rate: 64.41%
#   - Max Drawdown: -7.03%
#   - Total Trades: 59
#
# Half-Year Consistency:
#   - H1 2024: Sharpe 1.30, Return 12.85%
#   - H2 2024: Sharpe 1.35, Return 14.55%
#
# Usage: python -m src.backtest_runner --config config/backtesting/ict_production.yaml

mode: single

strategy:
  name: ICTStrategy
  parameters:
    # Trade Type
    trade_type: both  # Enable both reversal and continuation setups

    # Market Structure Detection
    swing_lookback: 5  # Bars for swing point detection
    min_swing_size_pct: 0.0025  # 0.25% minimum swing size

    # Order Block Parameters
    min_impulse_move_pct: 0.004  # 0.4% minimum impulse for OB
    order_block_max_age: 50  # Max bars for OB validity
    impulse_bars: 10  # Bars to look for impulse after OB

    # Risk/Reward
    risk_reward_ratio: 1.5  # Conservative R:R ratio
    atr_period: 14
    atr_stop_multiplier: 1.8  # Wider stops to avoid noise

    # Filters
    use_htf_filter: true  # Require HTF trend alignment
    htf_lookback: 40  # Longer lookback for clearer trend
    use_regime: true  # Enable regime filtering
    use_volume_filter: true  # Confirm with volume
    rvol_threshold: 1.5  # 150% of average volume required

    # Switch Candle Requirements
    min_wick_ratio: 0.55  # Strong rejection wick required
    min_body_ratio: 0.4  # Decisive candle body
    sweep_threshold_pct: 0.0012  # Clear sweep threshold

    # Position Management
    long_only: false  # Allow both long and short
    max_positions_per_day: 2  # Quality over quantity

    # Time Management
    exit_time_hour: 15
    exit_time_minute: 45
    session_filter: none

symbols:
  # Top 10 most liquid stocks
  list: [NVDA, TSLA, AMD, META, GOOGL, AMZN, NFLX, AAPL, MSFT, SPY]

dates:
  start: "2024-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001  # 0.1% per trade
  slippage: 0.0005  # 0.05% slippage
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.08  # 8% per position
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
