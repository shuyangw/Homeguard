# ICT Strategy - Crypto Backtest Configuration
#
# Testing ICT/SMC concepts on crypto assets (BTC, ETH)
# as per original strategy specification
#
# KEY DIFFERENCES FROM EQUITY VERSION:
# - No session filter (crypto trades 24/7)
# - No market hours restriction
# - No EOD exit time
# - Crypto symbols use _USD suffix (BTC_USD, ETH_USD)

mode: single
strategy:
  name: ICTStrategy
  parameters:
    trade_type: both
    swing_lookback: 5
    min_swing_size_pct: 0.003
    min_impulse_move_pct: 0.005
    order_block_max_age: 30
    impulse_bars: 8
    risk_reward_ratio: 2.0
    use_htf_filter: false
    use_regime: false
    use_volume_filter: false
    # No session filter for 24/7 crypto
    session_filter: none
    max_positions_per_day: 5
    atr_period: 14
    atr_stop_multiplier: 1.5
    min_wick_ratio: 0.5
    min_body_ratio: 0.3
    sweep_threshold_pct: 0.0015
    long_only: false
    # No EOD exit for crypto
    exit_time_hour: 23
    exit_time_minute: 59
    min_sweep_depth_pct: 0.0
    use_momentum_filter: false
    use_trailing_stop: false
    use_structure_filter: false
    require_ob_confluence: false
symbols:
  list:
  - BTC_USD
  - ETH_USD
dates:
  start: '2023-01-01'
  end: '2024-12-31'
backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.001
  benchmark: BTC_USD
  # Crypto trades 24/7
  market_hours_only: false
  allow_shorts: true
  portfolio_mode: multi
  # Use crypto data directory
  timeframe: crypto_1min
risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.1
  max_positions: 4
output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
