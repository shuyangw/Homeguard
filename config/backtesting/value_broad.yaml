# config/backtesting/value_broad.yaml -- Asness 5yr-to-1yr reversal value, 33-root broad basket.
# Absolute (Carver-style) futures carry over the 33-root broad basket.
# Requires the carry cache: python scripts/data/build_carry_cache.py --roots <...> --start 2010-06-07 --end 2026-02-20
# Walk-forward: python scripts/backtest_scripts/run_carver_walkforward.py \
#   --config config/backtesting/carry_broad.yaml --report docs/reports/futures/CARRY_BROAD_READINESS.md
asset_class: futures

strategy:
  name: FuturesValue
  universe:
    - ES
    - NQ
    - YM
    - ZT
    - ZF
    - ZN
    - TN
    - ZB
    - UB
    - 6E
    - 6J
    - 6B
    - 6A
    - 6C
    - 6S
    - 6M
    - 6N
    - CL
    - BZ
    - NG
    - HO
    - RB
    - GC
    - SI
    - HG
    - PL
    - ZC
    - ZW
    - ZS
    - ZL
    - ZM
    - LE
    - HE

dates:
  start: "2010-06-07"
  end: "2026-02-20"

backtest:
  initial_capital: 10000000
  vol_target_per_instrument: 0.20
  rebalance: weekly
  cost_mult: 1.0

pre_registration:
  construction: "Asness 5-year-to-1-year price reversal (value) signal, vol-scaled per instrument over the 33-root broad basket, no IDM"
  expected_sign: "long_short"
  hypothesis: "Long-horizon mean reversion (cheap vs 5y history) earns a positive premium OOS -- RECORDED REJECT: prior walk-forward found no robust OOS edge for this signal"
