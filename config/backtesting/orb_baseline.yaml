# Opening Range Breakout - Baseline (No improvements)
# Usage: python -m src.backtest_runner --config config/backtesting/orb_baseline.yaml

mode: single

strategy:
  name: ORBStrategy
  parameters:
    # Opening Range
    opening_range_minutes: 15
    min_or_width_pct: 0.0  # No filter

    # Entry Filters
    rvol_threshold: 1.5
    rvol_lookback: 20
    fast_ema: 9
    slow_ema: 21
    use_regime: false
    use_gap_filter: false

    # No Phase 2/3 improvements
    breakout_buffer_pct: 0.0
    entry_cutoff_hour: 15
    entry_cutoff_minute: 30
    use_atr_stops: false
    use_volume_confirmation: false
    use_trailing_stop: false

    # Target and Trade Management
    target_multiplier: 1.0
    one_trade_per_day: false
    long_only: false

symbols:
  # 3x Leveraged ETFs
  list: [TQQQ, SOXL, UPRO, TNA, TECL]

dates:
  start: "2024-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.10
  max_positions: 5

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 1
