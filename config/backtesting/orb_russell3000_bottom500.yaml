# Opening Range Breakout - Russell 3000 Bottom 500 (Smallest Cap)
# Test universe: Last 500 symbols from Russell 2000 (small-cap segment)
# Goal: Compare ORB performance on small-cap vs large-cap (S&P 500 high-vol)
# Note: Earnings filter disabled - no earnings data for most Russell 2000 stocks

mode: sweep

strategy:
  name: ORBStrategy
  parameters:
    opening_range_minutes: 15
    min_or_width_pct: 0.0
    rvol_threshold: 1.5
    rvol_lookback: 20
    fast_ema: 9
    slow_ema: 21
    use_regime: false
    use_gap_filter: false
    breakout_buffer_pct: 0.0
    entry_cutoff_hour: 15
    entry_cutoff_minute: 30
    use_atr_stops: false
    use_trailing_stop: false
    target_multiplier: 1.0
    one_trade_per_day: false
    long_only: false
    # Earnings filter disabled for Russell 3000 (no earnings data for most small-cap)
    use_earnings_filter: false
    earnings_buffer_days: 2
    earnings_calendar_path: null

symbols:
  file: backtest_lists/russell3000_bottom500.csv

dates:
  start: "2020-01-01"
  end: "2024-12-31"

backtest:
  initial_capital: 100000
  fees: 0.001
  slippage: 0.0005
  benchmark: SPY
  market_hours_only: true
  allow_shorts: true
  portfolio_mode: multi
  timeframe: 1min

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.05
  max_positions: 10

sweep:
  sort_by: "Total Return"
  top_n: 500
  parallel: true
  max_workers: 8
  export_csv: true

output:
  save_trades: true
  save_reports: true
  quantstats: false
  visualize: false
  verbosity: 0
