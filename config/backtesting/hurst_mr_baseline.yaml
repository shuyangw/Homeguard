# Hurst Mean Reversion Strategy - Baseline (Conservative) Config
# Optimized for capital preservation with consistent returns
#
# Expected Performance (2023-2024 out-of-sample):
#   - Return: ~10% annually
#   - Sharpe: ~1.0
#   - Max Drawdown: ~27%
#   - Trades: ~290
#
# Hurst Interpretation:
#   - H < 0.5: Mean-reverting (anti-persistent) - TRADE
#   - H = 0.5: Random walk
#   - H > 0.5: Trending (persistent) - AVOID

mode: single

strategy:
  name: HurstMRStrategy
  parameters:
    # Hurst parameters - strict filter
    hurst_window: 100
    hurst_threshold: 0.40       # Strict mean-reversion filter

    # Z-score parameters
    zscore_window: 20
    zscore_entry_threshold: 2.0
    zscore_exit_threshold: 0.3

    # Risk management
    atr_period: 14
    atr_stop_multiplier: 1.5
    atr_target_multiplier: 4.5

    # Trade management
    long_only: false
    max_hold_bars: 5            # Short holding period

    # Fixed percentage exits
    use_fixed_pct_exits: true
    fixed_stop_pct: 0.10        # 10% stop loss
    fixed_target_pct: 0.318     # 31.8% take profit (3:1 R:R)

symbols:
  # Top 5 performers from training optimization (2021-2022)
  list:
    - YFI_USD   # Yearn Finance - Sharpe 0.89
    - BCH_USD   # Bitcoin Cash - Sharpe 0.86
    - LINK_USD  # Chainlink - Sharpe 0.78
    - MKR_USD   # Maker - Sharpe 0.69
    - ETH_USD   # Ethereum - Sharpe 0.66

dates:
  start: '2023-01-01'
  end: '2024-12-31'

backtest:
  initial_capital: 100000
  fees: 0.001          # deprecated fallback; honored only when costs.tier is unset
  slippage: 0.0005     # deprecated fallback; honored only when costs.tier is unset
  benchmark: BTC_USD
  market_hours_only: false
  allow_shorts: true
  portfolio_mode: single
  timeframe: crypto_1hour
  fractional_shares: true


# Per methodology Section 4. crypto_alt tier -> YFI/BCH/LINK/MKR/ETH mix: altcoin tier ~140 bps round-trip.
costs:
  tier: crypto_alt
  stop_slippage_multiplier: 1.5

risk:
  enabled: true
  position_sizing_method: fixed_percent
  position_size_pct: 0.20       # 20% per symbol (100% total exposure)
  max_positions: 5
  use_stop_loss: true
  stop_loss_pct: 0.10

output:
  save_trades: true
  save_reports: true
  quantstats: true
  visualize: false
  verbosity: 1
