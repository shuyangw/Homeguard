# Grafana alert rules for Homeguard monitoring
# Import via Grafana UI: Alerting -> Import
# Or provision via Grafana alerting API

groups:
  - name: homeguard-trading
    rules:
      - alert: DrawdownApproachingLimit
        expr: max(hg_portfolio_drawdown_pct) > 7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Portfolio drawdown at {{ $value }}%"
          description: "Drawdown exceeding 7% for 5 minutes. Review positions."

      - alert: DrawdownCritical
        expr: max(hg_portfolio_drawdown_pct) > 9
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Portfolio drawdown at {{ $value }}%"
          description: "Drawdown exceeding 9%. Check if auto-stop triggered."

      - alert: IBGatewayDown
        expr: (time() - max(hg_broker_last_heartbeat_timestamp{broker="ibkr"})) > 120 and max(hg_market_open) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "IB Gateway unreachable for {{ $value }}s"
          description: "Check IBC service, may need manual login."

      - alert: WebSocketDisconnected
        expr: min(hg_websocket_connected{provider="iex"}) == 0 and max(hg_market_open) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IEX WebSocket disconnected during market hours"

      - alert: StrategySignalStale
        expr: (time() - max(hg_strategy_last_signal_timestamp) by (strategy)) > 7200 and max(hg_market_open) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Strategy {{ $labels.strategy }} signal stale ({{ $value }}s)"

      - alert: OrderRejectionSpike
        expr: sum(rate(hg_orders_rejected_total[5m])) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Order rejection rate elevated"

      # Catches a service crash-loop or hard-down WHILE the instance is up.
      # The RAMP metrics target (port 8082) goes unreachable when the process
      # dies repeatedly (e.g. the 2026-06-09 preflight false-zero that
      # crash-looped ~1000x silently). Gated on node-exporter being up so it
      # stays SILENT during the nightly EventBridge shutdown (both targets drop
      # together then). 5m tolerates the brief gap of a single clean restart.
      - alert: RampServiceDownOrCrashLooping
        expr: up{job="homeguard-ramp"} == 0 and on() up{job="node"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RAMP metrics target down while instance is up (possible crash-loop)"
          description: "homeguard-ramp (127.0.0.1:8082) unreachable for 5m while node-exporter shows the instance up -- the service is down or crash-looping. Check `journalctl -u homeguard-multi`; a preflight reconciler exit is the known failure mode."
