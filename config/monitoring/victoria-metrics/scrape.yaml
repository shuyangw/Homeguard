global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'homeguard-omr'
    static_configs:
      - targets: ['127.0.0.1:8081']
    metrics_path: /metrics

  - job_name: 'homeguard-ramp'
    static_configs:
      - targets: ['127.0.0.1:8082']
    metrics_path: /metrics

  - job_name: 'homeguard-mp'
    static_configs:
      - targets: ['127.0.0.1:8083']
    metrics_path: /metrics

  - job_name: 'homeguard-cscm'
    static_configs:
      - targets: ['127.0.0.1:8084']
    metrics_path: /metrics

  - job_name: 'node'
    static_configs:
      - targets: ['127.0.0.1:9100']
    metrics_path: /metrics
