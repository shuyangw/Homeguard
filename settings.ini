[windows]
local_storage_dir = H:\Stock_Data
options_data_dir = H:\Stock_Data\options
output_dir = H:\Homeguard_Output
discord_bot_log_dir = H:\Homeguard_Output\discord_bot
api_threads = 8

[linux]
# For EC2: Use /home/ec2-user (Amazon Linux default user)
# For local Linux: Adjust paths as needed
local_storage_dir = /home/ec2-user/stock_data
options_data_dir = /home/ec2-user/options_data
output_dir = /home/ec2-user/logs
discord_bot_log_dir = /home/ec2-user/logs/discord_bot
api_threads = 8

[tearsheets]
# Frequency for tearsheet data resampling to reduce file size
# Options: full (no resampling), H (hourly), D (daily), W (weekly)
# Daily recommended for most users (393x smaller files, 99% accuracy)
# Hourly for day traders (35x smaller, 99.5% accuracy)
# Full for maximum precision (100% accuracy, but 100+ MB files)
frequency = H
